[project]
name = "ecs-celery-autoscaler"
version = "0.1.0"
description = "Scale an ECS service's worker count on Celery task publish/completion"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34",
    "celery>=5.3",
    "redis>=4.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"