[project]
name = "ecs-celery-autoscaler"
version = "0.1.4"
description = "Scale an ECS service's worker count on Celery task load"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34",
    "celery>=5.3",
    "redis>=4.5",
]

readme="README.md"

license = "MIT"
license-files = ["LICEN[CS]E*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecs_celery_autoscaler"]

[project.urls]
Homepage = "https://github.com/zagaran/ecs-celery-autoscaler"